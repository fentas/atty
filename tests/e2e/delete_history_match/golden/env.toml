# atty e2e — recorded environment
atty_version = "0.1.0"
cols = 60
rows = 6

[argv]
0 = "$ATTY"
1 = "bash"
2 = "--norc"
3 = "--noprofile"
4 = "-i"

[forced_env]
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TERM = "xterm-256color"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
HOME = "/tmp"
SHELL = "/bin/sh"
USER = "test"
PS1 = "$ "
