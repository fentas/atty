# atty e2e — recorded environment
atty_version = "0.4.0"
cols = 100
rows = 12

[argv]
0 = "$ATTY"
1 = "bash"
2 = "--norc"
3 = "--noprofile"
4 = "-i"

[forced_env]
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TERM = "xterm-256color"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
HOME = "/tmp"
SHELL = "/bin/sh"
USER = "test"
PS1 = "$ "

[extra_env]
ATTY_BIN = ".zig-cache/e2e/llm_dialog_mode_persists/bin/atty"
