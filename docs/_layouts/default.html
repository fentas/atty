<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
</head>
<body class="doc">
  {% include topnav.html %}
  <label class="sidebar-scrim" for="sidebar-toggle" aria-hidden="true"></label>

  <div class="doc-shell">
    {% include sidebar.html %}

    <main class="doc-main">
      <article class="doc-article">
        {{ content }}

        <nav class="doc-footer-nav">
          <a class="doc-edit" href="https://github.com/fentas/atty/edit/master/docs{{ page.path | replace_first: 'docs/', '/' }}" rel="noopener">Edit this page on GitHub&nbsp;↗</a>
        </nav>
      </article>
    </main>

    <aside class="toc-rail" aria-label="On this page">
      <div class="toc-rail-inner">
        <p class="toc-rail-title">On this page</p>
        <div id="toc-rail-slot"></div>
      </div>
    </aside>
  </div>

  <footer class="site-footer">
    <p>
      <span class="prompt">#</span> Suckless-style PTY proxy in Zig 0.16 ·
      <a href="https://github.com/fentas/atty">source</a> ·
      <a href="https://atty.sh">atty.sh</a>
    </p>
  </footer>

  <script>
    // Move the kramdown-generated `#markdown-toc` (if the page has one)
    // into the right TOC rail, then run scroll-spy across visible headings.
    (function () {
      var slot = document.getElementById('toc-rail-slot');
      var rail = document.querySelector('.toc-rail');
      var toc = document.getElementById('markdown-toc');
      if (toc && slot) {
        slot.appendChild(toc);
        document.body.classList.add('toc-moved');
      } else {
        document.body.classList.add('no-toc');
      }
      if (!toc) return;

      var links = Array.from(toc.querySelectorAll('a[href^="#"]'));
      if (!links.length) return;
      var map = new Map();
      for (var i = 0; i < links.length; i++) {
        var a = links[i];
        var id = decodeURIComponent(a.getAttribute('href').slice(1));
        var el = document.getElementById(id);
        if (el) map.set(el, a);
      }
      if (!map.size) return;
      var visible = new Set();
      var lastActive = null;
      function setActive(link) {
        if (link === lastActive) return;
        if (lastActive) lastActive.classList.remove('is-active');
        link.classList.add('is-active');
        lastActive = link;
        if (typeof link.scrollIntoView === 'function') {
          var r = link.getBoundingClientRect();
          var tr = toc.getBoundingClientRect();
          if (r.top < tr.top || r.bottom > tr.bottom) {
            link.scrollIntoView({ block: 'nearest' });
          }
        }
      }
      function pickActive() {
        var best = null, bestTop = -Infinity;
        visible.forEach(function (el) {
          var top = el.getBoundingClientRect().top;
          if (top <= 120 && top > bestTop) { bestTop = top; best = el; }
        });
        if (!best && visible.size) {
          var minTop = Infinity;
          visible.forEach(function (el) {
            var top = el.getBoundingClientRect().top;
            if (top < minTop) { minTop = top; best = el; }
          });
        }
        if (best && map.has(best)) setActive(map.get(best));
      }
      var obs = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          var e = entries[i];
          if (e.isIntersecting) visible.add(e.target);
          else visible.delete(e.target);
        }
        pickActive();
      }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
      map.forEach(function (_a, el) { obs.observe(el); });
      pickActive();
      window.addEventListener('hashchange', function () {
        var id = decodeURIComponent(location.hash.slice(1));
        var el = document.getElementById(id);
        if (el && map.has(el)) setActive(map.get(el));
      });
    })();
  </script>
</body>
</html>
