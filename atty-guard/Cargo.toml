[package]
name = "atty-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sidecar daemon for atty security_guard: Tier-1 regex classifier over a Unix domain socket, with stubs for Tier-2 encoder SLM and eBPF backstop"
repository = "https://github.com/fentas/atty"

[[bin]]
name = "atty-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# V2-G Tier-1 AtomMatcher. Aho-Corasick compiles N atoms into one
# DFA, scans the typed line in O(line_len) regardless of N.
# Mature crate (powers ripgrep). ~50 KB additional binary weight.
aho-corasick = "1.1"
clap = { version = "4", features = ["derive"] }
# V2-B eBPF loader. See `ebpf/README.md`.
libbpf-rs = { version = "0.24.5", optional = true }
# V2-C Tier-2 ONNX SLM backend. `tract-onnx` is pure-Rust —
# no `libonnxruntime.so` dep, no bindgen compile flakiness, fewer
# moving parts. tokenizers stays pure-Rust for HF-style tokeniser JSON.
tract-onnx = { version = "0.21", optional = true, default-features = false }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
toml = { version = "0.8", optional = true }
# V2-F live OSV.dev lookup. ureq is the smallest blocking HTTP
# client in the ecosystem with rustls for TLS — no openssl
# flakiness. Pulled in only when `osv-live` is enabled.
# Also reused by V2-I atom-fetcher when both features are on.
ureq = { version = "2.10", optional = true, default-features = false, features = ["tls", "json"] }
# V2-I atom fetcher — pulls IOC corpora from GTFOBins (+ future
# Sigma / LOLBAS) into `flagged_atoms.txt`. flate2 + tar to
# extract upstream GitHub tarballs; serde_yaml to parse the
# YAML-fronted manifests. All optional, gated behind
# `atoms-fetch`. ~6 MB combined dep weight; default build skips.
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", optional = true, default-features = false }
serde_yaml = { version = "0.9", optional = true }
# V2-I tarball integrity. Pinned-SHA verification of upstream
# tarballs before we let any bytes reach the classifier. sha2
# is pure-Rust + ~40 KB compiled; gated behind atoms-fetch so
# default builds don't pay it.
sha2 = { version = "0.10", optional = true, default-features = false }

[features]
default = []
# Build the V2-B userspace eBPF loader. Requires libbpf-dev on the
# build host and CAP_BPF at runtime. See `ebpf/README.md`.
ebpf = ["dep:libbpf-rs"]
# Build the V2-C ONNX Tier-2 backend (SecureBERT 2.0 / Qwen2.5-Coder
# / any HF-tokeniser ONNX classifier). Uses pure-Rust tract — no
# system onnxruntime needed. See `docs/security-guard-slm.md`.
tier2-onnx = ["dep:tract-onnx", "dep:tokenizers", "dep:toml"]
# Build the V2-F live OSV.dev lookup. Hits the upstream API per
# uncached `npm install <pkg>`; default off (network use is opt-in).
osv-live = ["dep:ureq"]
# Build the V2-I atom fetcher: `atty-guard atoms update` +
# `--atoms-update-interval` cron-style background refresh.
# Reuses ureq for HTTPS; adds flate2 + tar + serde_yaml for
# tarball + YAML parsing. See `docs/security-guard-updates.md`.
atoms-fetch = ["dep:ureq", "dep:flate2", "dep:tar", "dep:serde_yaml", "dep:sha2", "dep:toml"]

[dev-dependencies]
# trust_store tests use tempdir-rooted file ops; no global env mutation.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
