name: release

# Fires when release-please merges its release PR and pushes a tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # upload release assets
  packages: write     # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build static musl binaries for every supported target. Zig cross-
  # compiles from a single amd64 host — no QEMU, no host toolchain
  # juggling, all artifacts go in one fan-in step.
  # ---------------------------------------------------------------------------
  binaries:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            asset_arch: linux-x86_64
          - target: aarch64-linux-musl
            asset_arch: linux-aarch64
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build (${{ matrix.target }})
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      # End-to-end scenarios — spawn atty under a controlled PTY and
      # diff a rendered terminal grid against goldens. We only run on
      # the native target because cross-built musl binaries can't be
      # executed on the x86_64 GitHub runner.
      - name: e2e (native only)
        if: matrix.target == 'x86_64-linux-musl'
        run: |
          zig build -Doptimize=ReleaseSafe
          zig build e2e

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"   # strip leading "v"
          stem="atty-${version}-${{ matrix.asset_arch }}"
          unver="atty-${{ matrix.asset_arch }}"

          mkdir -p dist
          install -m 0755 zig-out/bin/atty "dist/atty"

          # tarball contains a single `atty` binary at the top level
          tar -C dist -czf "dist/${stem}.tar.gz" atty
          ( cd dist && sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256" )

          # Versioned bare binary (for archives / pinned downloads).
          install -m 0755 zig-out/bin/atty "dist/${stem}"
          ( cd dist && sha256sum "${stem}" > "${stem}.sha256" )

          # Unversioned bare binary — the canonical "latest" download
          # URL the installer at https://get.atty.sh resolves to.
          install -m 0755 zig-out/bin/atty "dist/${unver}"
          ( cd dist && sha256sum "${unver}" > "${unver}.sha256" )

          rm dist/atty

          {
            echo "stem=${stem}"
            echo "unver=${unver}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: smoke test (${{ matrix.target }})
        if: matrix.target == 'x86_64-linux-musl'
        run: |
          set -euo pipefail
          chmod +x dist/${{ steps.pkg.outputs.stem }}
          script -qfec "dist/${{ steps.pkg.outputs.stem }} bash -c 'echo atty-release-ok'" /dev/null 2>&1 | tee /tmp/out
          grep -q atty-release-ok /tmp/out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_arch }}
          path: |
            dist/atty-*.tar.gz
            dist/atty-*.tar.gz.sha256
            dist/atty-*-${{ matrix.asset_arch }}
            dist/atty-*-${{ matrix.asset_arch }}.sha256
            dist/atty-${{ matrix.asset_arch }}
            dist/atty-${{ matrix.asset_arch }}.sha256

  # ---------------------------------------------------------------------------
  # atty-guard sidecar binaries. Same musl cross-targets as `binaries`,
  # built with cargo-zigbuild so the existing zig toolchain doubles as
  # the Rust linker — no QEMU, no system musl, no host toolchain juggle.
  #
  # Features baked in: tier2-onnx (pure-Rust tract) + osv-live (ureq)
  # + atoms-fetch (ureq+flate2+tar+serde_yaml). eBPF is excluded —
  # `libbpf-rs` needs libbpf headers at build time and CAP_BPF at
  # runtime, both of which warrant a separate opt-in flavour rather
  # than the default release artifact. Users who want eBPF can
  # `cd atty-guard && cargo build --release --features ebpf` locally.
  # ---------------------------------------------------------------------------
  guard-binaries:
    name: build atty-guard (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_arch: linux-x86_64
          - target: aarch64-unknown-linux-musl
            asset_arch: linux-aarch64
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atty-guard
          key: ${{ matrix.target }}

      # Pin cargo-zigbuild to a known-good major. Without a version
      # constraint a breaking release at any point silently changes
      # the linker behaviour of a tagged atty release — bad for
      # reproducibility. `taiki-e/install-action` is the canonical
      # CI shortcut and respects the version pin.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.22

      - name: cargo zigbuild atty-guard
        working-directory: atty-guard
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} \
              --features tier2-onnx,osv-live,atoms-fetch

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stem="atty-guard-${version}-${{ matrix.asset_arch }}"
          unver="atty-guard-${{ matrix.asset_arch }}"
          bin_src="atty-guard/target/${{ matrix.target }}/release/atty-guard"

          mkdir -p dist
          install -m 0755 "$bin_src" "dist/atty-guard"

          tar -C dist -czf "dist/${stem}.tar.gz" atty-guard
          ( cd dist && sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256" )

          install -m 0755 "$bin_src" "dist/${stem}"
          ( cd dist && sha256sum "${stem}" > "${stem}.sha256" )

          install -m 0755 "$bin_src" "dist/${unver}"
          ( cd dist && sha256sum "${unver}" > "${unver}.sha256" )

          rm dist/atty-guard

          {
            echo "stem=${stem}"
            echo "unver=${unver}"
          } >> "$GITHUB_OUTPUT"

      # Native-only smoke test. The aarch64 binary is cross-built but
      # the runner is amd64 — we'd need QEMU to exec it, which the
      # existing atty pattern also avoids. Aarch64 ships un-smoke-
      # tested; if it links wrong, the link step would have errored.
      - name: smoke test (${{ matrix.target }})
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          # Exec the EXACT stem path — globbing matched both the
          # versioned binary and the unversioned alias, and bash
          # passed the second match as argv[1] making clap exit
          # non-zero on the "unexpected argument".
          chmod +x dist/${{ steps.pkg.outputs.stem }}
          ./dist/${{ steps.pkg.outputs.stem }} --version | grep -E '^atty-guard '

      - uses: actions/upload-artifact@v7
        with:
          name: atty-guard-${{ matrix.asset_arch }}
          path: |
            dist/atty-guard-*.tar.gz
            dist/atty-guard-*.tar.gz.sha256
            dist/atty-guard-*-${{ matrix.asset_arch }}
            dist/atty-guard-*-${{ matrix.asset_arch }}.sha256
            dist/atty-guard-${{ matrix.asset_arch }}
            dist/atty-guard-${{ matrix.asset_arch }}.sha256

  # ---------------------------------------------------------------------------
  # Publish artifacts to the GitHub Release once every binary is built.
  # ---------------------------------------------------------------------------
  publish:
    name: attach release assets
    needs: [binaries, guard-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: list
        run: ls -la dist/

      # Extract the section of CHANGELOG.md that matches this tag's
      # version so the Release body is populated with the per-version
      # notes release-please wrote (instead of empty). release-please-
      # action normally calls the Release API itself, but the squash-
      # merge auto-tag path bypasses that — see release-please.yml's
      # `auto-tag` step. This pulls the same content from CHANGELOG.md.
      - name: extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Match the header LITERALLY via `index()`, not as a regex.
          # release-please emits `## [<version>](<url>)`, so a regex
          # would treat the version's `.` chars as wildcards — fine
          # for stable `X.Y.Z` (unique anyway) but `0.5.0-rc.1` would
          # mis-match a sibling RC, and any future patch where two
          # versions share a prefix would be ambiguous.
          awk -v hdr="## [${version}]" '
            index($0, hdr) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "warning: no CHANGELOG.md section for $version; Release body will be empty"
          fi
          echo "--- preview (first 20 lines) ---"
          head -20 /tmp/release_body.md || true

      # Create or update the GitHub release + upload assets via the
      # `gh` CLI. Replaces `softprops/action-gh-release@v3`, whose
      # PATCH-first ("upsert") asset-metadata call races against
      # GitHub's eventually-consistent read replica and can fail
      # nondeterministically on the final asset (see #376). `gh
      # release upload --clobber` is a single POST per file with no
      # metadata sidecar; the action's intermittent late-asset 404
      # disappears.
      - name: create or update release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            { find dist -maxdepth 1 -type f \( \
                -name 'atty-*.tar.gz' -o \
                -name 'atty-*.tar.gz.sha256' -o \
                -name 'atty-*-linux-*' -o \
                -name 'atty-linux-*' -o \
                -name 'atty-guard-linux-*' \
              \) | sort -u
            }
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets matched in dist/ — refusing to publish an empty release"
            ls -la dist/ || true
            exit 1
          fi
          echo "Found ${#assets[@]} assets:"
          printf '  %s\n' "${assets[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating body"
            gh release edit "$TAG" --notes-file /tmp/release_body.md
          else
            echo "Creating release $TAG"
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_body.md
          fi

          # `--clobber` overwrites an existing asset (idempotent
          # re-runs are safe). One POST per file; no metadata
          # update step that could 404.
          #
          # Caveat: --clobber deletes the existing asset BEFORE
          # the re-upload. A retry that dies mid-upload leaves the
          # release missing that asset until the next successful
          # run. Acceptable for transient retries; if a maintainer
          # is hand-tweaking assets between runs, expect overwrites.
          gh release upload "$TAG" --clobber "${assets[@]}"

  # ---------------------------------------------------------------------------
  # Multi-arch Docker image to ghcr.io/<owner>/atty.
  # Re-uses the Dockerfile's BUILDPLATFORM/TARGETARCH split so the Zig
  # toolchain only runs on amd64 (no QEMU).
  # ---------------------------------------------------------------------------
  docker:
    name: docker push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
