name: release-please

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

# Avoid racing the per-push CI run; release-please is fast but should
# never collide with itself.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain release PR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The action reads commits since the last release and:
      #   • opens (or updates) a "chore(release): X.Y.Z" PR
      #   • on merge of that PR (merge-commit style), creates the
      #     vX.Y.Z tag.
      # The tag push then triggers .github/workflows/release.yml.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Squash-merge workaround.
      #
      # release-please-action's tag-push only fires when the release
      # PR is merged via "Create a merge commit." This repo squashes
      # everything (see CLAUDE.md), so the action's heuristic finds
      # no merge commit matching its PR's tracked SHA and silently
      # skips the tag. Every subsequent run then sees "untagged
      # release PR outstanding" and aborts.
      #
      # This step closes the gap: after each push to master we check
      # whether the manifest version on master has a corresponding
      # git tag, and if not, push it. Idempotent — re-runs on
      # unrelated pushes just see the tag already exists and exit.
      # Also flips the merged release PR's `autorelease: pending`
      # label to `autorelease: tagged` so the action doesn't keep
      # re-detecting the same PR.
      - name: auto-tag squash-merged release PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(jq -r '.["."]' .release-please-manifest.json)
          # Sanity-check the manifest before doing anything stateful.
          # A corrupt or empty manifest would emit `null`, and the
          # downstream tag-push would silently create `vnull` — bad.
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "error: invalid manifest version '$ver'" >&2
            echo "       .release-please-manifest.json may be corrupt or empty" >&2
            exit 1
          fi
          tag="v${ver}"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists locally; nothing to do"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists on remote; nothing to do"
            exit 0
          fi

          # Identify the PR whose merge brought the manifest to this
          # version. The action labels its PRs `autorelease: pending`
          # and titles them `chore: release master` (per the title-
          # pattern in release-please-config.json). The newest such
          # merged PR is the one we want. Belt-and-braces: filter by
          # head-branch too — release-please-action always opens its
          # PRs on `release-please--branches--<base>`, so this rules
          # out any out-of-band `chore: release …` PR a maintainer
          # might have mislabelled.
          pr=$(gh pr list --state merged --label "autorelease: pending" \
              --head "release-please--branches--master" \
              --json number,mergeCommit \
              --jq '.[0] | "\(.number) \(.mergeCommit.oid)"' 2>/dev/null || true)
          if [ -z "$pr" ] || [ "$pr" = "null null" ]; then
            echo "no pending release PR to tag (HEAD manifest=$ver, no matching merged PR)"
            exit 0
          fi
          pr_num=$(echo "$pr" | cut -d' ' -f1)
          pr_sha=$(echo "$pr" | cut -d' ' -f2)

          # Verify the merge SHA is actually in the local tree — a
          # rebased/force-pushed merged PR (rare) would have a stale
          # mergeCommit.oid; tag-from-missing-sha would surface as a
          # confusing `unknown revision` error otherwise.
          if ! git cat-file -e "${pr_sha}^{commit}" 2>/dev/null; then
            echo "error: PR #${pr_num}'s merge SHA ${pr_sha} not in local tree" >&2
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$pr_sha" -m "Release $tag"
          git push origin "$tag"
          echo "tagged $tag at $pr_sha (from PR #$pr_num)"

          gh pr edit "$pr_num" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged"
