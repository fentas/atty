name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: zig build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig fmt --check
        run: zig fmt --check src/ build.zig

      - name: zig build
        run: zig build -Doptimize=ReleaseSafe

      - name: zig build test
        run: zig build test --summary all

      - name: zig build itest
        # GitHub-hosted runners have /dev/ptmx; integration test
        # spawns /bin/echo through a real PTY.
        run: zig build itest --summary all

      - name: zig build e2e
        # Scripted-PTY scenarios + VT grid diff. Catches rendering,
        # LLM fixture protocol, keymap and OSC 133 drift the unit
        # tests miss. Running on every push surfaces drift the day
        # the code that caused it lands, not at the next release.
        run: zig build e2e --summary all

      - name: smoke test
        # atty refuses non-TTY stdio (src/main.zig), so we wrap it in
        # `script` (util-linux on the runner host, NOT inside the
        # docker image) to allocate a real PTY for the spawned
        # binary. The inner `bash -c` exits after running, which
        # fires SIGCHLD → atty's main loop exits cleanly.
        run: |
          set -euo pipefail
          script -qfec "./zig-out/bin/atty bash -c 'echo atty-ci-ok'" /dev/null 2>&1 | tee /tmp/out
          grep -q atty-ci-ok /tmp/out

      - uses: actions/upload-artifact@v7
        with:
          name: atty-linux-x86_64
          path: zig-out/bin/atty
          retention-days: 14

  # atty-guard is a separate Rust crate. Test it on default features
  # AND with the user-facing feature set (tier2-onnx + osv-live +
  # atoms-fetch) so the build doesn't quietly break when a feature-
  # gated module gets touched. eBPF is intentionally excluded — it
  # needs libbpf-dev + CAP_BPF at runtime, neither of which the
  # default runner provides.
  guard:
    name: cargo build + test (atty-guard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atty-guard

      - name: cargo test (default features)
        working-directory: atty-guard
        run: cargo test --quiet

      - name: cargo test (tier2-onnx + osv-live + atoms-fetch)
        working-directory: atty-guard
        run: cargo test --features tier2-onnx,osv-live,atoms-fetch --quiet

      # eBPF code can't be tested in CI (needs CAP_BPF + kernel
      # LSM support), but `cargo check` exercises the libbpf-rs
      # build path so a refactor that breaks the kernel-loader
      # call sites surfaces here instead of at release time.
      - name: install libbpf-dev (for ebpf compile-check)
        run: sudo apt-get install -y --no-install-recommends libbpf-dev

      - name: cargo check --features ebpf
        working-directory: atty-guard
        run: cargo check --features ebpf --quiet

  # Cross-compile the SHIPPED musl release configuration on every PR.
  # CI's `zig` job builds glibc-native, so a musl-only breakage — a
  # libc extern that resolves differently under musl (history.zig's
  # variadic `open`), a struct field musl lacks, a ReleaseFast-only
  # miscompile — would otherwise first surface in release.yml at tag
  # push, after the PR already merged. This gate runs the exact build
  # invocation release.yml uses for both shipped arches. Compile-only:
  # cross-built musl/aarch64 binaries can't execute on the x86_64
  # runner without QEMU, and the `zig` job already covers native
  # execution (test/itest/e2e/smoke).
  musl:
    name: musl cross-compile (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build (${{ matrix.target }})
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build (builder stage only)
        # We only build the binary; pushing an image isn't a CI concern.
        run: docker build --target builder -t atty:builder .

      - name: extract + smoke-test binary
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" atty:builder \
              cp /src/zig-out/bin/atty /out/atty
          file dist/atty
          set -euo pipefail
          script -qfec "./dist/atty bash -c 'echo atty-docker-ok'" /dev/null 2>&1 | tee /tmp/out
          grep -q atty-docker-ok /tmp/out
